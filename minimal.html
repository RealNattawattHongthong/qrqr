<!DOCTYPE html>
<html>
<head>
    <title>Minimal QR Code</title>
</head>
<body>
    <input type="text" id="text" placeholder="Enter text">
    <button onclick="generate()">Generate</button>
    <div id="qr"></div>
    <script>
        function generate() {
            var text = document.getElementById('text').value;
            if (text) {
                document.getElementById('qr').innerHTML = '<img src="https://api.qrserver.com/v1/create-qr-code/?data=' + encodeURIComponent(text) + '">';
            }
        }
    </script>
</body>
</html>
